name: Build ReClip APK

# Builds one "fat" APK on GitHub's native x86_64 runner (no emulation).
# NOTE: we do NOT use the kivy/buildozer container -- it ships Python 3.14 and
# a broken venv pip, which crashes python-for-android. Ubuntu + Python 3.11 is
# the well-tested combination.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    # Two separate APKs, built in parallel: English and Italian.
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: en
            pkg: reclip
            domain: com.reclip
            title: ReClip
          - lang: it
            pkg: reclipit
            domain: com.reclipit
            title: ReClip IT
    # ubuntu-22.04: buildozer's officially supported base. On ubuntu-latest the
    # system Python is 3.14 and p4a's internal venv pip is broken there.
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure UI variant (${{ matrix.lang }})
        run: |
          echo "lang=${{ matrix.lang }} pkg=${{ matrix.pkg }}"
          if [ "${{ matrix.lang }}" = "it" ]; then
            # Italian APK: the translated template becomes the app's index.html
            cp reclip/templates/index_it.html reclip/templates/index.html
            sed -i "s|^package.name = .*|package.name = ${{ matrix.pkg }}|" buildozer.spec
            sed -i "s|^package.domain = .*|package.domain = ${{ matrix.domain }}|" buildozer.spec
            sed -i "s|^title = .*|title = ${{ matrix.title }}|" buildozer.spec
          fi
          grep -E "^(title|package.name|package.domain) " buildozer.spec

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk-headless \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses-dev libncursesw5-dev cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Select Java 17
        # ubuntu-22.04 defaults JAVA_HOME to Java 11, but the Android Gradle
        # plugin requires Java 17. Point both JAVA_HOME and PATH at the JDK 17
        # we installed above.
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"

      - name: Install buildozer + Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade "buildozer==1.5.0" "cython==0.29.36"

      - name: Restore ffmpeg build cache
        id: ffcache
        uses: actions/cache/restore@v4
        with:
          path: libs
          # Bump this key when the ffmpeg source/config below changes.
          key: ffmpeg-7.1-ndk-r29-api24-v1

      - name: Build Android-native ffmpeg/ffprobe (NDK, with libmp3lame)
        # A glibc binary cannot run on Android: seccomp kills it with SIGSYS.
        # So compile ffmpeg for Android (bionic) with the NDK. Non-fatal: if this
        # fails, the next step provides a fallback so the APK still builds.
        # Skipped entirely when the cache above restored the binaries.
        id: ffbuild
        if: steps.ffcache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          set -e
          NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$NDK" ] || { echo "no NDK found"; exit 1; }
          echo "NDK=$NDK"
          TC=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          API=24
          JOBS=$(nproc)
          W=/tmp/ffb
          rm -rf "$W"; mkdir -p "$W"; cd "$W"

          curl -fsSL -o lame.tar.gz \
            https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz
          tar xf lame.tar.gz
          curl -fsSL -o ffmpeg.tar.xz https://ffmpeg.org/releases/ffmpeg-7.1.tar.xz
          tar xf ffmpeg.tar.xz

          build_one() {
            ABI=$1; ARCH=$2; CPU=$3; CCPREFIX=$4; HOST=$5; EXTRA=$6
            echo "=== $ABI (arch=$ARCH cc=$CCPREFIX) ==="
            cd "$W"
            rm -rf "lame-$ABI"; cp -r lame-3.100 "lame-$ABI"; cd "lame-$ABI"
            ./configure --host=$HOST --prefix="$W/lame-$ABI" \
              --disable-shared --enable-static --disable-frontend \
              CC="$TC/bin/${CCPREFIX}${API}-clang" \
              AR="$TC/bin/llvm-ar" RANLIB="$TC/bin/llvm-ranlib" STRIP="$TC/bin/llvm-strip" \
              CFLAGS="-O2 -fPIC" >/dev/null
            make -j"$JOBS" >/dev/null
            make install >/dev/null

            cd "$W"
            rm -rf "ff-$ABI"; cp -r ffmpeg-7.1 "ff-$ABI"; cd "ff-$ABI"
            ./configure \
              --prefix="$W/ff-$ABI" \
              --target-os=android --arch=$ARCH --cpu=$CPU $EXTRA \
              --enable-cross-compile --sysroot="$TC/sysroot" \
              --cc="$TC/bin/${CCPREFIX}${API}-clang" \
              --cxx="$TC/bin/${CCPREFIX}${API}-clang++" \
              --ar="$TC/bin/llvm-ar" --nm="$TC/bin/llvm-nm" \
              --ranlib="$TC/bin/llvm-ranlib" --strip="$TC/bin/llvm-strip" \
              --disable-shared --enable-static \
              --disable-doc --disable-ffplay --disable-debug --disable-network \
              --enable-libmp3lame \
              --extra-cflags="-I$W/lame-$ABI/include -O2" \
              --extra-ldflags="-L$W/lame-$ABI/lib" >/dev/null
            make -j"$JOBS" >/dev/null
            file ffmpeg ffprobe
          }

          build_one arm64-v8a   aarch64 armv8-a aarch64-linux-android        aarch64-linux ""
          build_one armeabi-v7a arm     armv7-a armv7a-linux-androideabi     arm-linux     "--enable-neon"

          # NB: absolute path! The cwd was changed to $W above, so a relative
          # "libs/..." would land in /tmp instead of the repo workspace.
          OUT="${GITHUB_WORKSPACE:-$PWD}/libs"
          mkdir -p "$OUT/arm64-v8a" "$OUT/armeabi-v7a"
          cp "$W/ff-arm64-v8a/ffmpeg"    "$OUT/arm64-v8a/libffmpeg.so"
          cp "$W/ff-arm64-v8a/ffprobe"   "$OUT/arm64-v8a/libffprobe.so"
          cp "$W/ff-armeabi-v7a/ffmpeg"  "$OUT/armeabi-v7a/libffmpeg.so"
          cp "$W/ff-armeabi-v7a/ffprobe" "$OUT/armeabi-v7a/libffprobe.so"
          file "$OUT"/*/libffmpeg.so
          find "$OUT" -type f -exec ls -lh {} \;

      - name: Save ffmpeg build cache
        # Only cache a genuinely successful NDK build (never the glibc fallback).
        if: steps.ffbuild.outcome == 'success' && steps.ffcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: libs
          key: ffmpeg-7.1-ndk-r29-api24-v1

      - name: Fallback ffmpeg libs (only if the NDK build failed)
        run: |
          set -e
          python3 - <<'PY'
          import glob, os, shutil, tarfile, urllib.request
          need = [p for p in ("libs/arm64-v8a/libffmpeg.so",
                              "libs/armeabi-v7a/libffmpeg.so") if not os.path.exists(p)]
          if not need:
              print("NDK binaries present, no fallback needed")
              raise SystemExit(0)
          print("missing:", need, "-> downloading static fallback")
          urllib.request.urlretrieve(
              "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-arm64-static.tar.xz",
              "/tmp/ff_arm64.tar.xz")
          urllib.request.urlretrieve(
              "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-armhf-static.tar.xz",
              "/tmp/ff_armhf.tar.xz")

          # Everything in Python: bash lines after the heredoc would run anyway
          # and fail (that skipped the whole APK build once).
          for archive, tag, abi in (("/tmp/ff_arm64.tar.xz", "arm64", "arm64-v8a"),
                                    ("/tmp/ff_armhf.tar.xz", "armhf", "armeabi-v7a")):
              dest = "/tmp/ffx_" + abi
              os.makedirs(dest, exist_ok=True)
              with tarfile.open(archive) as tar:
                  tar.extractall(dest)
              found = glob.glob(os.path.join(dest, "ffmpeg-*-%s-static" % tag))
              if not found:
                  raise SystemExit("no extracted dir for " + abi)
              os.makedirs("libs/%s" % abi, exist_ok=True)
              for name in ("ffmpeg", "ffprobe"):
                  target = "libs/%s/lib%s.so" % (abi, name)
                  if not os.path.exists(target):
                      shutil.copy(os.path.join(found[0], name), target)

          for abi in ("arm64-v8a", "armeabi-v7a"):
              for name in ("libffmpeg.so", "libffprobe.so"):
                  path = "libs/%s/%s" % (abi, name)
                  print(path, os.path.getsize(path))
          PY

      - name: Build APK (release)
        # buildozer 1.5 has NO keystore options (its default.spec has none), so
        # it only produces an unsigned release APK; we sign it in the next step.
        run: |
          set -e
          echo "JAVA_HOME=$JAVA_HOME"
          java -version 2>&1 | head -1
          python3 --version
          buildozer -v android release
          ls -lh bin/ || true

      - name: Sign the release APK (apksigner)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYALIAS: ${{ secrets.KEYALIAS }}
          KEYALIAS_PASS: ${{ secrets.KEYALIAS_PASS }}
        run: |
          set -e
          UNSIGNED=$(ls bin/*release*.apk 2>/dev/null | head -1 || true)
          if [ -z "$UNSIGNED" ]; then echo "no release apk in bin/"; ls -lh bin/ || true; exit 1; fi
          echo "unsigned: $UNSIGNED"

          BT=$(ls -d "$HOME"/.buildozer/android/platform/android-sdk/build-tools/*/ \
                    /usr/local/lib/android/sdk/build-tools/*/ 2>/dev/null | sort -V | tail -1)
          echo "build-tools: $BT"
          [ -x "${BT}zipalign" ] || { echo "zipalign/apksigner not found"; exit 1; }

          echo "$KEYSTORE_B64" | base64 -d > "$HOME/reclip.keystore"
          "${BT}zipalign" -f 4 "$UNSIGNED" /tmp/aligned.apk
          "${BT}apksigner" sign \
            --ks "$HOME/reclip.keystore" \
            --ks-key-alias "$KEYALIAS" \
            --ks-pass "pass:$KEYSTORE_PASS" \
            --key-pass "pass:$KEYALIAS_PASS" \
            --out "bin/reclip-${{ matrix.lang }}-release-signed.apk" /tmp/aligned.apk

          echo "--- signature ---"
          "${BT}apksigner" verify --print-certs "bin/reclip-${{ matrix.lang }}-release-signed.apk" | head -6
          rm -f "$UNSIGNED"
          ls -lh bin/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reclip-apk-${{ matrix.lang }}
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error
