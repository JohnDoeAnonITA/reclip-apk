name: Build ReClip APK

# Builds one "fat" APK on GitHub's native x86_64 runner (no emulation).
# NOTE: we do NOT use the kivy/buildozer container -- it ships Python 3.14 and
# a broken venv pip, which crashes python-for-android. Ubuntu + Python 3.11 is
# the well-tested combination.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    # ubuntu-22.04: buildozer's officially supported base. On ubuntu-latest the
    # system Python is 3.14 and p4a's internal venv pip is broken there.
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk-headless \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses-dev libncursesw5-dev cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Install buildozer + Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade buildozer cython

      - name: Bundle STATIC ffmpeg (arm64 + armhf)
        run: |
          set -e
          python3 - <<'PY'
          import urllib.request
          urllib.request.urlretrieve(
              "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-arm64-static.tar.xz",
              "/tmp/ff_arm64.tar.xz")
          urllib.request.urlretrieve(
              "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-armhf-static.tar.xz",
              "/tmp/ff_armhf.tar.xz")
          PY
          mkdir -p /tmp/x64 /tmp/xhf
          tar -xJf /tmp/ff_arm64.tar.xz -C /tmp/x64
          tar -xJf /tmp/ff_armhf.tar.xz -C /tmp/xhf
          cp /tmp/x64/ffmpeg-*-arm64-static/ffmpeg ./ffmpeg_arm64
          cp /tmp/xhf/ffmpeg-*-armhf-static/ffmpeg ./ffmpeg_armhf
          chmod +x ./ffmpeg_arm64 ./ffmpeg_armhf
          ls -lh ./ffmpeg_arm64 ./ffmpeg_armhf

      - name: Build APK
        run: |
          python3 --version
          which python3
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reclip-arm-apk
          path: bin/*.apk
          if-no-files-found: error
