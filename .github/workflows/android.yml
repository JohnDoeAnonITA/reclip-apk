name: Build ReClip APK

# Builds one "fat" APK on GitHub's native x86_64 runner (no emulation).
# NOTE: we do NOT use the kivy/buildozer container -- it ships Python 3.14 and
# a broken venv pip, which crashes python-for-android. Ubuntu + Python 3.11 is
# the well-tested combination.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    # ubuntu-22.04: buildozer's officially supported base. On ubuntu-latest the
    # system Python is 3.14 and p4a's internal venv pip is broken there.
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk-headless \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses-dev libncursesw5-dev cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Select Java 17
        # ubuntu-22.04 defaults JAVA_HOME to Java 11, but the Android Gradle
        # plugin requires Java 17. Point both JAVA_HOME and PATH at the JDK 17
        # we installed above.
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"

      - name: Install buildozer + Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade "buildozer==1.5.0" "cython==0.29.36"

      - name: Bundle ffmpeg/ffprobe as native libs
        run: |
          set -e
          python3 - <<'PY'
          import urllib.request
          urllib.request.urlretrieve(
              "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-arm64-static.tar.xz",
              "/tmp/ff_arm64.tar.xz")
          urllib.request.urlretrieve(
              "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-armhf-static.tar.xz",
              "/tmp/ff_armhf.tar.xz")
          PY
          mkdir -p /tmp/x64 /tmp/xhf libs/arm64-v8a libs/armeabi-v7a
          tar -xJf /tmp/ff_arm64.tar.xz -C /tmp/x64
          tar -xJf /tmp/ff_armhf.tar.xz -C /tmp/xhf
          # Android 10+ makes the app data dir noexec; files under the APK's
          # lib/<abi>/ ARE executable, so ship the binaries as lib*.so there.
          cp /tmp/x64/ffmpeg-*-arm64-static/ffmpeg  libs/arm64-v8a/libffmpeg.so
          cp /tmp/x64/ffmpeg-*-arm64-static/ffprobe libs/arm64-v8a/libffprobe.so
          cp /tmp/xhf/ffmpeg-*-armhf-static/ffmpeg  libs/armeabi-v7a/libffmpeg.so
          cp /tmp/xhf/ffmpeg-*-armhf-static/ffprobe libs/armeabi-v7a/libffprobe.so
          find libs -type f -exec ls -lh {} \;

      - name: Build APK
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version 2>&1 | head -1
          python3 --version
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reclip-arm-apk
          path: bin/*.apk
          if-no-files-found: error
