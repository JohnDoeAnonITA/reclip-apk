name: Build ReClip APK

# Builds a single arm64-v8a APK on an x86_64 GitHub runner.
# REQUIRED: the Android NDK / python-for-android only ship x86_64 host
# toolchains -- you cannot build from an arm64 host (PRoot/Termux/etc).

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bundle STATIC ffmpeg (arm64 + armhf)
        run: |
          set -e
          # The buildozer container has no curl/wget -> download with Python.
          # Statically-linked builds: a glibc-dynamic binary would NOT run on
          # Android (bionic). Static ones have no interpreter/deps -> run fine.
          python3 - <<'PY'
          import urllib.request
          urllib.request.urlretrieve(
              "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-arm64-static.tar.xz",
              "/tmp/ff_arm64.tar.xz")
          urllib.request.urlretrieve(
              "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-armhf-static.tar.xz",
              "/tmp/ff_armhf.tar.xz")
          PY
          mkdir -p /tmp/x64 /tmp/xhf
          tar -xJf /tmp/ff_arm64.tar.xz -C /tmp/x64
          tar -xJf /tmp/ff_armhf.tar.xz -C /tmp/xhf
          cp /tmp/x64/ffmpeg-*-arm64-static/ffmpeg ./ffmpeg_arm64
          cp /tmp/xhf/ffmpeg-*-armhf-static/ffmpeg ./ffmpeg_armhf
          chmod +x ./ffmpeg_arm64 ./ffmpeg_armhf
          ls -lh ./ffmpeg_arm64 ./ffmpeg_armhf

      - name: Build multi-ABI APK (debug)
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reclip-multiarch-apk
          path: bin/*.apk
          if-no-files-found: error
